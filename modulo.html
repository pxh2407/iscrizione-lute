<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1f6f5c">
<meta name="robots" content="noindex">
<title>Modulo iscrizione LUTE</title>
<meta property="og:title" content="📄 Modulo di iscrizione L.U.T.E. – da salvare o stampare">
<meta property="og:description" content="Tocca per aprire il modulo compilato come immagine JPG.">
<style>
:root{ --verde:#1f6f5c; --verde-scuro:#144a3d; --crema:#fbf9f4; --testo:#22302c; --bordo:#cfd9d5; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{font-size:19px}
body{margin:0;background:var(--crema);color:var(--testo);font-family:"Segoe UI",Roboto,Arial,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:16px}
.pulsanti{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.btn{flex:1 1 200px;border:0;border-radius:14px;font:inherit;font-size:1.1rem;font-weight:700;padding:15px;cursor:pointer;
  background:var(--verde);color:#fff;text-align:center;text-decoration:none}
.btn.sec{background:#fff;color:var(--verde-scuro);border:2px solid var(--verde)}
#img{width:100%;display:block;border:1px solid var(--bordo);border-radius:8px;background:#fff}
.errore{background:#fdecea;color:#b3261e;border:2px solid #b3261e;border-radius:12px;padding:14px;font-weight:600}
@media print{
  @page{size:A4;margin:10mm}
  body{background:#fff}
  .wrap{padding:0;max-width:none}
  .pulsanti{display:none}
  #img{border:0;border-radius:0;max-height:277mm;width:auto;max-width:100%;margin:0 auto}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="pulsanti" id="pulsanti" hidden>
    <a class="btn" id="salva" download>📥 Salva immagine JPG</a>
    <button class="btn sec" id="stampa" type="button">🖨️ Stampa</button>
  </div>
  <img id="img" alt="Modulo di iscrizione compilato" hidden>
  <div class="errore" id="errore" hidden>Il link del modulo non è completo. Apri il link intero ricevuto su WhatsApp.</div>
</div>

<script src="corsi.js"></script>
<script src="modulo.js"></script>
<script>
const $ = id => document.getElementById(id);
const logo = new Image();
logo.onload = logo.onerror = mostra;
logo.src = 'img/logo-lute.png';

function mostra(){
  let d;
  try { d = decodificaDati(location.hash.slice(1)); } catch(e){ $('errore').hidden = false; return; }
  const canvas = disegnaModulo(d, logo);
  const url = canvas.toDataURL('image/jpeg', 0.92);
  $('img').src = url; $('img').hidden = false;
  $('salva').href = url;
  $('salva').download = 'Iscrizione_LUTE_' + ((d.nome || 'socio').trim().replace(/[^\p{L}\p{N}]+/gu, '_')) + '.jpg';
  $('pulsanti').hidden = false;
  document.title = 'Modulo iscrizione – ' + (d.nome || '');
}
$('stampa').addEventListener('click', () => window.print());
</script>
</body>
</html>
